name: Release

# Tag push (v*) → build compendium packs → stamp version/download in
# system.json → zip the system → GitHub release with system.json + zip
# attached. The install manifest URL is the stable
# releases/latest/download/system.json channel.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pack tooling
        working-directory: tools
        run: npm ci || npm install --no-fund --no-audit

      - name: Build compendium packs
        run: node tools/build-packs.mjs

      - name: Stamp manifest version + download URL
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          jq --arg version "$VERSION" \
             --arg download "https://github.com/${{ github.repository }}/releases/download/${TAG}/hellas-${TAG}.zip" \
             '.version = $version | .download = $download' \
             system.json > system.json.tmp
          mv system.json.tmp system.json

      - name: Static audit + migration smoke tests
        run: node tools/audit.mjs && node tools/test-migrations.mjs

      - name: Build system archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          zip -r "hellas-${TAG}.zip" \
            system.json hellas.mjs module templates styles lang assets packs fonts \
            LICENSE README.md CHANGELOG.md \
            -x "packs/_source/*"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            system.json
            hellas-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Pushes the release to the foundryvtt.com package listing. Skipped
      # (not failed) until the package is registered there and the
      # FOUNDRY_PACKAGE_TOKEN repo secret exists. Guarded inside the shell
      # deliberately: reviewers disagreed on whether a step's own env is
      # visible to its `if:`, and the shell guard is correct either way.
      # Per the Package Release API docs the manifest URL must be the
      # VERSION-SPECIFIC asset, not the latest channel.
      - name: Publish to foundryvtt.com package listing
        env:
          FOUNDRY_PACKAGE_TOKEN: ${{ secrets.FOUNDRY_PACKAGE_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$FOUNDRY_PACKAGE_TOKEN" ]; then
            echo "FOUNDRY_PACKAGE_TOKEN not set - skipping foundryvtt.com publish"
            exit 0
          fi
          VERSION="${TAG#v}"
          MIN=$(jq -er '.compatibility.minimum // empty' system.json)
          VER=$(jq -er '.compatibility.verified // empty' system.json)
          BODY=$(jq -n --arg v "$VERSION" --arg min "$MIN" --arg ver "$VER" \
            --arg manifest "https://github.com/${REPO}/releases/download/${TAG}/system.json" \
            --arg notes "https://github.com/${REPO}/releases/tag/${TAG}" \
            '{id: "hellas", release: {version: $v, manifest: $manifest, notes: $notes, compatibility: {minimum: $min, verified: $ver, maximum: ""}}}')
          curl -sS --fail-with-body -X POST "https://foundryvtt.com/_api/packages/release_version/" \
            -H "Content-Type: application/json" \
            -H "Authorization: $FOUNDRY_PACKAGE_TOKEN" \
            -d "$BODY"
